{% extends 'generator/base.html' %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="card">
  <h1>Sign in</h1>
  {% if form.errors %}<p class="error">Your username and password did not match. Please try again.</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Sign in</button>
    <input type="hidden" name="next" value="{{ next }}">
  </form>
</div>
{% endblock %}
